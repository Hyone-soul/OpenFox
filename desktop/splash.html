<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenFox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 420px;
      height: 280px;
      overflow: hidden;
      background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    .logo-wrapper img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: cover;
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .brand-sub {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 24px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      opacity: 0.9;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .status-text {
      min-width: 100px;
    }

    .progress-bar {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #fff;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }

    .footer {
      position: absolute;
      bottom: 16px;
      font-size: 11px;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="logo-wrapper">
    <img src="assets/icon.png" alt="OpenFox" />
  </div>
  <div class="brand">OpenFox</div>
  <div class="brand-sub">Agent Skills Framework</div>
  <div class="status-bar">
    <div class="spinner"></div>
    <span class="status-text" id="status">正在启动...</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>
  <div class="footer">Powered by Electron + Vue3 + FastAPI</div>

  <script>
    const { ipcRenderer } = require('electron')
    const statusEl = document.getElementById('status')
    const progressEl = document.getElementById('progress')

    const statusMessages = {
      starting: '正在启动后端服务...',
      waiting: '等待后端就绪...',
      running: '后端已就绪',
      error: '启动失败',
      crashed: '后端崩溃',
    }

    ipcRenderer.on('splash:status', (_, data) => {
      if (data.text) {
        statusEl.textContent = data.text
      } else if (data.status) {
        statusEl.textContent = statusMessages[data.status] || data.status
      }
      if (data.progress !== undefined) {
        progressEl.style.width = data.progress + '%'
      }
    })
  </script>
</body>
</html>
